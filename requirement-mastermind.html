<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>要件定義デスゲーム - プロトタイプ</title>
<style>
  :root{
    --bg: #0b0e14;
    --bg-panel: #131722;
    --bg-panel-2: #1a1f2e;
    --border: #2a3145;
    --text: #e8ecf4;
    --text-dim: #8892a6;
    --cyan: #4dd8e6;
    --amber: #f0c419;
    --red: #ff5d5d;
    --green: #5ddc8f;
    --purple: #b48ce6;
    --font-ui: 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse at top, #161c2b 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--font-ui);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header.app-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .mascot{
    width:52px;height:52px;flex:none;border-radius:10px;
    background:linear-gradient(145deg,#1c2333,#0d111c);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .mascot img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .title-block h1{font-size:17px; margin:0; letter-spacing:.04em;}
  .title-block .sub{font-size:11px; color:var(--text-dim); letter-spacing:.12em; margin-top:2px;}

  .panel{
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:12px; padding:20px; margin-bottom:16px;
  }
  .panel h2{
    font-size:13px; margin:0 0 12px; color:var(--amber);
    letter-spacing:.08em; display:flex; align-items:center; gap:8px;
  }
  .panel h2::before{content:"";width:6px;height:6px;background:var(--amber);border-radius:1px;display:inline-block;}

  .case-btn{
    text-align:left; background:var(--bg-panel-2); border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:8px; cursor:pointer;
    font-family:var(--font-ui); width:100%;
  }

  .flavor-block{
    margin-bottom:10px; padding:10px 12px;
    background:var(--bg-panel-2); border-left:3px solid var(--border);
    border-radius:0 6px 6px 0; font-size:12.5px; line-height:1.7;
  }
  .flavor-block .tag{
    font-size:10px; color:var(--cyan); letter-spacing:.1em;
    display:block; margin-bottom:4px; font-family:var(--font-mono);
  }

  .resource-row{display:flex; gap:16px; margin-bottom:14px;}
  .resource-item{
    flex:1; background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:8px; padding:10px; text-align:center;
  }
  .resource-item .r-label{font-size:10.5px; color:var(--text-dim); letter-spacing:.05em;}
  .resource-item .r-value{font-size:20px; font-weight:700; color:var(--cyan); margin-top:2px;}

  .matrix-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .matrix-row{
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px;
  }
  .matrix-row.is-revealed{border-color:var(--amber);}
  .matrix-row .item-name{font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .revealed-badge{font-size:10px; color:var(--amber); font-family:var(--font-mono);}
  .revealed-badge.guess-only{color:var(--text-dim);}
  .moscow-btns{display:flex; gap:6px;}
  .moscow-btn{
    flex:1; padding:8px 4px; border-radius:6px; border:1px solid var(--border);
    background:transparent; color:var(--text-dim); font-size:11.5px;
    cursor:pointer; font-family:var(--font-ui); transition:.12s;
  }
  .moscow-btn.selected{background:var(--bg-panel); border-color:var(--cyan); color:var(--cyan); font-weight:600;}
  .moscow-btn.selected.cat-must{border-color:var(--red); color:var(--red);}
  .moscow-btn.selected.cat-should{border-color:var(--amber); color:var(--amber);}
  .moscow-btn.selected.cat-could{border-color:var(--purple); color:var(--purple);}
  .moscow-btn:disabled{opacity:.35; cursor:not-allowed;}

  .feedback-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;
  }
  .feedback-item{
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:8px; padding:10px 6px; text-align:center;
  }
  .feedback-item .fb-label{font-size:10.5px; color:var(--text-dim);}
  .feedback-item .fb-value{font-size:16px; font-weight:700; margin-top:3px;}
  .feedback-item.cat-must .fb-value{color:var(--red);}
  .feedback-item.cat-should .fb-value{color:var(--amber);}
  .feedback-item.cat-could .fb-value{color:var(--purple);}
  .feedback-item.cat-wont .fb-value{color:var(--text-dim);}
  .feedback-grid.fit-gap{grid-template-columns:repeat(2,1fr);}
  .feedback-item.cat-fit .fb-value{color:var(--green); font-size:22px;}
  .feedback-item.cat-gap .fb-value{color:var(--red); font-size:22px;}

  .action-panel{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .action-select-row{display:flex; gap:8px; flex-wrap:wrap;}
  .action-select-row select{
    flex:1; min-width:120px; background:var(--bg-panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:6px; padding:8px; font-size:12.5px; font-family:var(--font-ui);
  }
  .action-btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .action-btn-row .btn.small{flex:1 1 calc(50% - 8px); min-width:0;}

  .btn{
    padding:13px; border-radius:8px; border:none;
    font-size:13.5px; font-weight:600; cursor:pointer; letter-spacing:.04em;
    font-family:var(--font-ui); transition:.15s; flex:1;
  }
  .btn.primary{background:var(--cyan); color:#062026;}
  .btn.primary:hover{filter:brightness(1.1);}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text-dim);}
  .btn.ghost:hover{border-color:var(--text-dim); color:var(--text);}
  .btn.small{padding:8px 6px; font-size:11.5px; flex:none; white-space:normal; line-height:1.3; word-break:break-word;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .action-row{display:flex; gap:10px; margin-top:14px;}

  .action-log{
    font-size:12px; padding:8px 10px; margin-bottom:8px;
    border-radius:6px; animation: fadein .25s ease;
  }
  .action-log.reveal{background:#123328; border:1px solid #1e5c46; color:#a7f0c9;}
  .action-log.miss{background:#2b2312; border:1px solid #4a3d17; color:#e6cf8a;}
  @keyframes fadein{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:translateY(0);}}

  .result-screen{text-align:center; padding:10px 4px;}
  .result-screen .skull{font-size:44px; margin-bottom:6px;}
  .result-title{font-size:20px; font-weight:700; margin:6px 0 4px;}
  .result-title.death{color:var(--red);}
  .result-title.success{color:var(--green);}
  .result-sub{font-size:12px; color:var(--text-dim); margin-bottom:18px;}
  .cause-card{
    text-align:left; background:var(--bg-panel-2); border:1px solid #3a2020;
    border-radius:8px; padding:16px; margin-bottom:14px;
  }
  .cause-card.success-card{border-color:#1e3a2c;}
  .cause-card .cause-name{font-size:15px; font-weight:700; color:var(--red); margin-bottom:8px;}
  .cause-card.success-card .cause-name{color:var(--green);}
  .cause-card .cause-detail{font-size:12.5px; line-height:1.7; color:var(--text); margin-bottom:10px;}
  .cause-card .cause-hint{font-size:11.5px; color:var(--text-dim); padding-top:10px; border-top:1px dashed var(--border);}

  .transition-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 20px; text-align:center;
  }
  .mascot-lg{
    width:120px;height:120px;flex:none;border-radius:16px;
    background:linear-gradient(145deg,#1c2333,#0d111c);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    position:relative; margin-bottom:22px; overflow:hidden;
    animation: mascotFloat 1.6s ease-in-out infinite;
  }
  .mascot-lg img{width:100%;height:100%;object-fit:contain;padding:8px; animation: eyeBlink 2.4s ease-in-out infinite;}
  @keyframes mascotFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes eyeBlink{0%,88%,100%{opacity:1;}92%{opacity:.15;}}
  .transition-msg{font-size:14px; color:var(--text); letter-spacing:.03em; margin-bottom:6px;}
  .transition-sub{font-size:11.5px; color:var(--text-dim); letter-spacing:.08em;}

  .summary-row{display:flex; align-items:center; justify-content:space-between;}
  .summary-count{font-size:20px; font-weight:700; color:var(--cyan);}
  .summary-count span{font-size:11px; font-weight:400; color:var(--text-dim); margin-left:4px;}

  .tab-row{display:flex; gap:8px; margin-bottom:14px;}
  .tab-btn{
    flex:1; padding:9px; border-radius:7px; border:1px solid var(--border);
    background:transparent; color:var(--text-dim); font-size:12.5px;
    cursor:pointer; font-family:var(--font-ui); transition:.12s;
  }
  .tab-btn.active{background:var(--bg-panel-2); border-color:var(--cyan); color:var(--cyan);}

  .collection-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
  .collection-item{
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:8px; padding:10px; font-size:11px; text-align:center; color:var(--text-dim);
  }
  .collection-item.unlocked{color:var(--red); border-color:#3a2020;}
  .item-no{display:block; font-size:9.5px; color:var(--text-dim); font-family:var(--font-mono); letter-spacing:.05em; margin-bottom:2px;}
  .mark{font-size:16px;display:block;margin-bottom:3px;}
  .collection-note{font-size:11px; color:var(--text-dim); text-align:center; margin-top:6px;}

  .pager-row{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:14px;}
  .pager-label{font-size:12px; color:var(--text-dim); letter-spacing:.05em;}

  .step-note{font-size:11.5px; color:var(--text-dim); margin-bottom:12px; line-height:1.6;}

  footer{text-align:center; font-size:10.5px; color:#454e64; margin-top:30px;}

  /* ===== タイトル画面 ===== */
  .title-panel{
    text-align:center; padding:36px 20px;
    border:1px solid #3a1616;
    box-shadow: 0 0 40px -10px rgba(255,60,60,.18) inset;
    position:relative;
  }
  .title-logo-row{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:999px; padding:8px 18px 8px 8px; margin-bottom:26px;
  }
  .title-logo-mascot{
    width:44px; height:44px; border-radius:10px; overflow:hidden;
    background:linear-gradient(145deg,#1c2333,#0d111c); flex:none;
    box-shadow: 0 0 14px -2px rgba(255,60,60,.45);
  }
  .title-logo-mascot img{width:100%; height:100%; object-fit:contain; padding:3px;}
  .title-logo-text{display:flex; align-items:center; gap:8px;}
  .title-logo-se{font-size:20px; font-weight:800; letter-spacing:.02em;}
  .title-logo-x{color:var(--amber);}
  .title-logo-genre{
    font-size:11px; color:var(--red); border-left:1px solid var(--border);
    padding-left:8px; letter-spacing:.05em;
  }
  .title-warn-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-bottom:10px;
  }
  .title-warn-dot{
    width:7px; height:7px; border-radius:50%; background:var(--red);
    box-shadow:0 0 8px 1px rgba(255,60,60,.7);
    animation: warnBlink 1.4s ease-in-out infinite;
  }
  .title-warn-text{
    font-size:10px; color:var(--red); letter-spacing:.15em; font-family:var(--font-mono);
  }
  @keyframes warnBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
  .title-main{
    font-size:26px; font-weight:800; margin:0 0 18px; letter-spacing:.03em;
    text-shadow: 0 0 18px rgba(255,60,60,.35);
  }
  .title-tagline{
    font-size:12.5px; color:var(--red); margin-bottom:24px; line-height:1.7;
    letter-spacing:.02em; opacity:.9;
  }
  .title-stats-row{display:flex; gap:14px; justify-content:center; margin-bottom:28px;}
  .title-stat{
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:10px; padding:12px 20px; min-width:100px;
  }
  .title-stat-value{font-size:22px; font-weight:700; color:var(--cyan);}
  .title-stat-label{font-size:10px; color:var(--text-dim); margin-top:2px;}
  .title-portal-link{
    display:block; margin-top:18px; font-size:11px; color:var(--text-dim);
    text-decoration:none; letter-spacing:.04em;
  }
  .title-portal-link:hover{color:var(--cyan);}

  /* ===== 生存PMチーム ===== */
  .pm-team-panel{border-color:#3a1616;}
  .pm-count-row{
    font-size:22px; font-weight:800; color:var(--red); margin-bottom:12px;
  }
  .pm-count-row span{font-size:12px; font-weight:400; color:var(--text-dim); margin-left:4px;}
  .pm-dot-grid{
    display:grid; grid-template-columns:repeat(10, 1fr); gap:5px;
  }
  .pm-dot{
    aspect-ratio:1; border-radius:3px; background:var(--red);
    box-shadow:0 0 5px 0 rgba(255,60,60,.5);
  }
  .pm-dot.lost{background:var(--bg-panel-2); border:1px solid var(--border); box-shadow:none;}

  .pm-event-banner{
    margin-top:14px; padding:12px; border-radius:8px;
    font-size:13px; font-weight:600; text-align:center;
  }
  .pm-event-clear{
    background:var(--bg-panel-2); border:1px solid var(--border);
    padding:18px 12px;
  }
  .pm-clear-remaining{font-size:13px; color:var(--text); font-weight:600;}
  .pm-clear-ellipsis{
    font-size:16px; color:var(--text-dim); letter-spacing:.3em; margin:10px 0;
    animation: ellipsisFade 1.8s ease-in-out infinite;
  }
  @keyframes ellipsisFade{0%,100%{opacity:.3;}50%{opacity:1;}}
  .pm-clear-next{font-size:11.5px; color:var(--red); letter-spacing:.1em;}
  .pm-event-departure{background:#2b1c1c; border:1px solid #4a2828; color:#e6a3a3; font-weight:400; font-size:12px;}
  .pm-event-bankrupt{background:#2b1010; border:1px solid var(--red); color:#ffb3b3; font-size:14px;}

  /* ===== キャラクターポップアップ ===== */
  .popup-scrim{
    position:fixed; inset:0; background:rgba(5,7,12,.75);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
    animation: scrimFadeIn .2s ease;
  }
  @keyframes scrimFadeIn{from{opacity:0;}to{opacity:1;}}
  .popup-card{
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:14px; padding:22px; max-width:360px; width:100%;
    text-align:center;
    animation: popupPop .22s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popupPop{from{opacity:0; transform:scale(.85);}to{opacity:1; transform:scale(1);}}
  .popup-icon{width:140px; height:140px; margin:0 auto 10px; border-radius:12px; overflow:hidden; background:var(--bg-panel-2);}
  .popup-icon img{width:100%; height:100%; object-fit:cover;}
  .popup-speaker{font-size:11px; color:var(--cyan); letter-spacing:.1em; margin-bottom:10px; font-family:var(--font-mono);}
  .popup-bubble{
    background:var(--bg-panel-2); border-radius:10px; padding:14px;
    font-size:13px; line-height:1.7; margin-bottom:16px; text-align:left;
  }
  .popup-bubble.reveal{border:1px solid #1e5c46; color:#a7f0c9;}
  .popup-bubble.miss{border:1px solid #4a3d17; color:#e6cf8a;}

  /* ===== 結果発表の演出強化 ===== */
  .reveal-count{
    font-size:40px; font-weight:700; color:var(--cyan); margin:14px 0;
    animation: countPulse .3s ease;
  }
  @keyframes countPulse{0%{transform:scale(1.15);}100%{transform:scale(1);}}
  .result-title.reveal-appear{animation: revealAppear .5s ease both;}
  @keyframes revealAppear{
    0%{opacity:0; transform:scale(.7) translateY(10px);}
    60%{opacity:1; transform:scale(1.08) translateY(0);}
    100%{opacity:1; transform:scale(1) translateY(0);}
  }
  .cause-card.stagger-in{animation: staggerIn .4s ease .35s both;}
  @keyframes staggerIn{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="mascot" id="headerMascot"></div>
    <div class="title-block">
      <h1>要件定義デスゲーム</h1>
      <div class="sub">SE&times;シリーズ 第三弾 — REQ</div>
    </div>
  </header>
  <div id="app"></div>
  <footer>PaoPao Studio — 内部検証用プロトタイプ</footer>
</div>

<script src="core-case-data.js"></script>

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

const CATEGORY_PHRASE = {
  Must: '絶対に必要です。これがないと困りますね。',
  Should: 'ぜひ欲しいところです。かなり重要だと思います。',

const CAT_CLASS = {Must:'cat-must', Should:'cat-should', Could:'cat-could', "Won't":'cat-wont'};

// 匂わせ文の末尾に添える、カテゴリに応じた一言(トーンだけで機械的に見抜かれないよう複数用意)

/* =========================================================
   セッション生成:MoSCoWの内訳数自体をランダム化する
========================================================= */
function generateSession(caseData){
  const pool = shuffle([...caseData.pool]);

  const mustCount = randInt(1,3);
  const remaining = 10 - mustCount;

  // Should/Could/Won'tの3つを、偏りなく均等にランダム分割する(2つの仕切りをランダムな位置に立てる方式)
  const cuts = new Set();
  while(cuts.size < 2){ cuts.add(randInt(1, remaining-1)); }
  const sorted = [...cuts].sort((a,b)=>a-b);
  const shouldCount = sorted[0];
  const couldCount = sorted[1]-sorted[0];
  const wontCount = remaining - sorted[1];

  const trueCategory = {};
  let idx = 0;
  pool.slice(idx, idx+mustCount).forEach(id=>trueCategory[id]='Must'); idx+=mustCount;
  pool.slice(idx, idx+shouldCount).forEach(id=>trueCategory[id]='Should'); idx+=shouldCount;
  pool.slice(idx, idx+couldCount).forEach(id=>trueCategory[id]='Could'); idx+=couldCount;
  pool.slice(idx, idx+wontCount).forEach(id=>trueCategory[id]="Won't");

  const guess = {};
  caseData.pool.forEach(id=>{ guess[id] = null; }); // デフォルトなし。全項目を能動的に分類させる(Won'tだけ自動正解になるのを防ぐ)

  // 匂わせ対象の3つは完全ランダム選出(カテゴリによる偏りはなし)
  const hintCandidates = caseData.pool.filter(id=>REQUIREMENTS[id].hints && REQUIREMENTS[id].hints.弱);
  const hintedItems = shuffle(hintCandidates).slice(0,3);

  return {
    caseId: caseData.id,
    trueCategory,
    trueCounts: {Must:mustCount, Should:shouldCount, Could:couldCount, "Won't":wontCount},
    knownScopeTotal: mustCount + shouldCount, // 最初から開示される開発スコープ(Must+Should)の件数
    guess,
    hintedItems,          // 会話に軽い匂わせが混ざっている要件(3つ)
    revealed: {},        // reqId -> true (確定済み)
    attempts: {},        // reqId -> Set(試した相手)
    ap: 5,                  // 単一APプール:本人確認1/各レビュー1のコストでやりくりする
    initialAp: 5,           // 「確認を使わずクリア」判定用に初期値を保持
    reviewUsed: {顧客:false, 営業:false, 現場:false},   // レビューは相手ごとに1回のみ
    reviewRevealed: {顧客:null, 営業:null, 現場:null},  // その相手が持つ要件のMust数/Won't数
    boundaryUsed: {ms:false, sc:false, cw:false},   // スコープレビュー(境界チェック)は境界ごとに1回のみ
    boundaryRevealed: {ms:null, sc:null, cw:null},  // 現在の自分の仮説に対する修正候補件数
    phase: 'guess1',      // 'guess1' -> 'actions' -> 'guess2'
    feedback: null,
    actionLog: [],        // 直近のアクション結果メッセージ
  };
}

// 案件の基本情報に、匂わせ対象の要件だけヒント文を差し込んだテキストを生成する
function buildFlavorText(caseData, session){
  const bySpeaker = {顧客:[], 営業:[], 現場:[], 資料:[]};
  session.hintedItems.forEach(id=>{
    const req = REQUIREMENTS[id];
    const target = req.correctTarget;
    const tailOptions = CATEGORY_HINT_TAIL[session.trueCategory[id]];
    const tail = tailOptions[Math.floor(Math.random()*tailOptions.length)];
    bySpeaker[target].push(`${req.hints.弱} ${tail}`);
  });
  const result = {};
  ['顧客','営業','現場','資料'].forEach(sp=>{
    result[sp] = caseData.base[sp] + (bySpeaker[sp].length ? ' ' + bySpeaker[sp].join(' ') : '');
  });
  return result;
}

function computeFeedback(session){
  let fit = 0;
  Object.keys(session.guess).forEach(id=>{
    if(session.guess[id]===session.trueCategory[id]) fit++;
  });
  return { fit, gap: 10 - fit };
}

function loadPmCount(){
  const raw = localStorage.getItem(PM_COUNT_KEY);
  if(raw===null) return PM_TOTAL;
  const n = parseInt(raw, 10);
  return isNaN(n) ? PM_TOTAL : n;
}
function savePmCount(n){ localStorage.setItem(PM_COUNT_KEY, String(n)); }
function resetPmCount(){ savePmCount(PM_TOTAL); return PM_TOTAL; }
function decrementPm(){
  const current = loadPmCount();
  const remaining = Math.max(0, current - 1);
  savePmCount(remaining);
  const name = PM_NAMES[Math.floor(Math.random()*PM_NAMES.length)];
  if(remaining<=0) resetPmCount(); // 倒産後はチームを再結成して継続
  return { name, remaining };
}

    const req = REQUIREMENTS[id];

function submitFirstGuess(){
  const session = state.session;
  session.feedback = computeFeedback(session);
  session.initialGuessSnapshot = Object.assign({}, session.guess); // 最終仮説画面で参照するための初期仮説の控え
  if(session.feedback.fit>=5) unlockAchievement('fit5plus');
  if(session.feedback.fit===10) unlockAchievement('perfect_fit10');
  session.fitFromGuess = new Set();
  Object.keys(session.guess).forEach(id=>{
    if(session.guess[id]===session.trueCategory[id]){
      session.revealed[id] = true;
      session.fitFromGuess.add(id);
    }
  });
  state.screen = 'actions';
  render();
}

  const reqOptions = unrevealed.map(id=>`<option value="${id}">${REQUIREMENTS[id].name}</option>`).join('');
  const targetOptions = ['顧客','営業','現場'].map(t=>`<option value="${t}">${t}に確認</option>`).join('');

  const logHTML = session.actionLog.slice(-4).map(l=>`<div class="action-log ${l.type}">${l.text}</div>`).join('');

  // 初期仮説(1回目の提出内容)を、Fit/確定/未確定の状態と合わせて一覧表示
  const guessSummaryRows = caseData.pool.map(id=>{
    const req = REQUIREMENTS[id];
    const isRevealed = !!session.revealed[id];
    const isFit = session.fitFromGuess && session.fitFromGuess.has(id);
    const cat = session.guess[id];
    let label;
    if(isFit) label = 'Fit:'+cat;
    else if(isRevealed) label = cat+'と確定(確認アクションで判明)';
    else label = '初期仮説:'+cat+'(Gap・要確認)';
    return `
      <div class="matrix-row ${isRevealed?'is-revealed':''}">
        <div class="item-name">
          ${req.name}
          <span class="revealed-badge ${isRevealed?'':'guess-only'}">${label}</span>
        </div>
      </div>
    `;
  }).join('');

  const verticalInfoHTML = (Object.values(session.reviewRevealed).some(v=>v!==null) || Object.values(session.boundaryRevealed).some(v=>v!==null)) ? `
    <div class="feedback-grid" style="grid-template-columns:repeat(2,1fr);">
      ${['顧客','営業','現場'].filter(t=>session.reviewRevealed[t]!==null).map(t=>`
        <div class="feedback-item cat-fit"><div class="fb-label">${t}の保有件数</div><div class="fb-value">${session.reviewRevealed[t].total}</div></div>
        <div class="feedback-item cat-must"><div class="fb-label">${t}のMust</div><div class="fb-value">${session.reviewRevealed[t].must}</div></div>
        <div class="feedback-item cat-wont"><div class="fb-label">${t}のWon't</div><div class="fb-value">${session.reviewRevealed[t].wont}</div></div>
      `).join('')}
    </div>
    ${SCOPE_BOUNDARIES.filter(b=>session.boundaryRevealed[b.id]!==null).map(b=>{
      const r = session.boundaryRevealed[b.id];
      return `<div class="step-note">${b.label}:今${b.upper}の${r.upperCount}件中${r.upperMisplaced}件は${b.lower}かも/今${b.lower}の${r.lowerCount}件中${r.lowerMisplaced}件は${b.upper}かも</div>`;
    }).join('')}
  ` : '';

  app.innerHTML = `
    <div class="panel">
      <h2>案件情報:${caseData.name}</h2>
      ${flavorHTML}
    </div>
    <div class="panel">
      <h2>確認アクション</h2>
      <div class="resource-row">
        <div class="resource-item"><div class="r-label">残りAP</div><div class="r-value">${session.ap}</div></div>
      </div>
      ${feedbackHTML}
      ${verticalInfoHTML}
      <div class="action-panel">
        ${unrevealed.length>0 ? `
        <div class="action-select-row">
          <select id="selReq">${reqOptions}</select>
          <select id="selTarget">${targetOptions}</select>
        </div>
        <div class="action-btn-row">
          <button class="btn ghost small" id="btnAskPerson" ${session.ap<1?'disabled':''}>確認する(AP1)</button>
        </div>
        ` : `<div class="step-note">すべての要件が確定しました。</div>`}
        <div class="action-btn-row">
          <button class="btn ghost small" id="btnReviewCustomer" ${session.ap<1 || session.reviewUsed['顧客'] ?'disabled':''}>顧客ヒアリング(AP1)</button>
          <button class="btn ghost small" id="btnReviewSales" ${session.ap<1 || session.reviewUsed['営業'] ?'disabled':''}>営業ヒアリング(AP1)</button>
          <button class="btn ghost small" id="btnReviewSite" ${session.ap<1 || session.reviewUsed['現場'] ?'disabled':''}>現場ヒアリング(AP1)</button>
        </div>
        <div class="action-btn-row">
          ${SCOPE_BOUNDARIES.map(b=>`<button class="btn ghost small scope-review-btn" data-boundary="${b.id}" ${session.ap<2 || session.boundaryUsed[b.id] ?'disabled':''}>${b.label}(AP2)</button>`).join('')}
        </div>
      </div>
      ${logHTML}
      <div class="step-note">初期仮説と、確認して確定した項目の一覧です。</div>
      <div class="matrix-list">${guessSummaryRows}</div>
      <div class="action-row">
        <button class="btn primary" id="btnGoFinal">最終仮説をまとめる</button>
      </div>
    </div>
    ${state.popup ? `
    <div class="popup-scrim" id="popupScrim">
      <div class="popup-card">
        <div class="popup-icon"><img src="${CHARACTER_SRC[state.popup.speaker]}" alt="${state.popup.speaker}"></div>
        <div class="popup-speaker">${state.popup.speaker}</div>
        <div class="popup-bubble ${state.popup.mood}">${state.popup.text}</div>
        <button class="btn primary" id="btnClosePopup">閉じる</button>
      </div>
    </div>
    ` : ''}
  `;

  const askBtn = document.getElementById('btnAskPerson');
  if(askBtn) askBtn.addEventListener('click', ()=>{
    const reqId = document.getElementById('selReq').value;
    const target = document.getElementById('selTarget').value;
    askPerson(reqId, target);
  });
  const reviewCustomerBtn = document.getElementById('btnReviewCustomer');
  if(reviewCustomerBtn) reviewCustomerBtn.addEventListener('click', ()=>checkReview('顧客'));
  const reviewSalesBtn = document.getElementById('btnReviewSales');
  if(reviewSalesBtn) reviewSalesBtn.addEventListener('click', ()=>checkReview('営業'));
  const reviewSiteBtn = document.getElementById('btnReviewSite');
  if(reviewSiteBtn) reviewSiteBtn.addEventListener('click', ()=>checkReview('現場'));
  app.querySelectorAll('.scope-review-btn').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', ()=>checkScopeReview(btn.dataset.boundary));
  });
  document.getElementById('btnGoFinal').addEventListener('click', ()=>{
    state.screen = 'guess2';
    render();
  });
  const closePopupBtn = document.getElementById('btnClosePopup');
  if(closePopupBtn) closePopupBtn.addEventListener('click', ()=>{
    state.popup = null;
    render();
  });
}

function revealRequirement(reqId){
  const session = state.session;
  session.revealed[reqId] = true;
  session.guess[reqId] = session.trueCategory[reqId];
}

function askPerson(reqId, target){
  const session = state.session;
  if(session.ap<1) return;
  const req = REQUIREMENTS[reqId];
  session.ap -= 1;

  let mood, text;
  if(req.correctTarget === target){
    revealRequirement(reqId);
    mood = 'reveal';
    const phrase = CATEGORY_PHRASE[session.trueCategory[reqId]];
    text = `「${req.name}」ですか。${phrase}(AP1消費)`;
    session.actionLog.push({type:'reveal', text:`${target}に確認したところ、「${req.name}」は${session.trueCategory[reqId]}であることが分かった。(AP1消費)`});
  } else {
    mood = 'miss';
    text = `この件は${req.correctTarget}に聞いてもらったほうがいいかもしれません。(AP1消費)`;
    session.actionLog.push({type:'miss', text:`${target}「この件は${req.correctTarget}に聞いてもらったほうがいいかもしれません」(AP1消費)`});
  }
  state.popup = { speaker: target, text, mood };
  render();
}

// 「Must◯件、Won't◯件」という数字を、自然なヒアリングの発言に変換する
function buildHearingSpeech(total, must, wont){
  let body;
  if(must===0 && wont===0){
    body = '正直これといって強い要望はないですね。';
  } else if(must===0){
    body = `絶対に外せないものは特にないですね。逆に、見送っていいものが${wont}つあります。`;
  } else if(wont===0){
    body = `どうしても実現したいものは${must}つあります。逆に、見送っていいものは特にないですね。`;
  } else {
    body = `どうしても実現したいものは${must}つあります。逆に、見送っていいものも${wont}つあります。`;
  }
  return `私の抱えているのは${total}件ありますが、${body}`;
}

function checkReview(target){
  const session = state.session;
  const caseData = CASES[session.caseId];
  if(session.ap<1 || session.reviewUsed[target]) return;
  session.ap -= 1;
  session.reviewUsed[target] = true;
  const targetItems = caseData.pool.filter(id=>REQUIREMENTS[id].correctTarget===target);
  const total = targetItems.length;
  const must = targetItems.filter(id=>session.trueCategory[id]==='Must').length;
  const wont = targetItems.filter(id=>session.trueCategory[id]==="Won't").length;
  session.reviewRevealed[target] = { total, must, wont };
  session.actionLog.push({type:'reveal', text:`${target}ヒアリングの結果、保有${total}件中Mustは${must}件、Won'tは${wont}件であることが分かった(どれかは不明)。(AP1消費)`});
  state.popup = { speaker: target, text: `${buildHearingSpeech(total, must, wont)}(AP1消費)`, mood:'reveal' };
  render();
}

// MoSCoWの優先度境界(3つ)の定義。自分の今の仮説を見直すための「社内レビュー」用
const SCOPE_BOUNDARIES = [
  { id:'ms', upper:'Must',   lower:'Should', label:'Must/Should境界レビュー' },
  { id:'sc', upper:'Should', lower:'Could',  label:'Should/Could境界レビュー' },
  { id:'cw', upper:'Could',  lower:"Won't",  label:"Could/Won't境界レビュー" },
];

function checkScopeReview(boundaryId){
  const session = state.session;
  const caseData = CASES[session.caseId];
  if(session.ap<2 || session.boundaryUsed[boundaryId]) return;
  const boundary = SCOPE_BOUNDARIES.find(b=>b.id===boundaryId);
  if(!boundary) return;
  session.ap -= 2;
  session.boundaryUsed[boundaryId] = true;

  // 現在「上位カテゴリ」に分類している項目のうち、本当は下位が正しいものの数(降格候補)
  const upperItems = caseData.pool.filter(id=>session.guess[id]===boundary.upper);
  const upperMisplaced = upperItems.filter(id=>session.trueCategory[id]===boundary.lower).length;
  // 現在「下位カテゴリ」に分類している項目のうち、本当は上位が正しいものの数(昇格候補)
  const lowerItems = caseData.pool.filter(id=>session.guess[id]===boundary.lower);
  const lowerMisplaced = lowerItems.filter(id=>session.trueCategory[id]===boundary.upper).length;

  session.boundaryRevealed[boundaryId] = {
    upperCount: upperItems.length, upperMisplaced,
    lowerCount: lowerItems.length, lowerMisplaced,
  };
  const speechText = `今${boundary.upper}としている${upperItems.length}件のうち${upperMisplaced}件は${boundary.lower}かもしれません。今${boundary.lower}としている${lowerItems.length}件のうち${lowerMisplaced}件は${boundary.upper}かもしれません。`;
  session.actionLog.push({type:'reveal', text:`${boundary.label}の結果:${speechText}(AP2消費)`});
  state.popup = { speaker:'社内レビュー', text:`${speechText}(AP2消費)`, mood:'reveal' };
  render();
}

function submitFinalGuess(){
  const session = state.session;
  const caseData = CASES[state.caseId];

  const finalFitCount = caseData.pool.filter(id=>session.guess[id]===session.trueCategory[id]).length;
  const exactMatch = finalFitCount === caseData.pool.length;

  let result;
  if(exactMatch){
    incrementClearCount();
    updateStreakOnResult(true);
    markCaseCleared(session.caseId);
    if(session.ap===1) unlockAchievement('ap_remaining_1');
    if(session.ap===session.initialAp) unlockAchievement('no_actions_used');
    if(session.feedback.fit===0) unlockAchievement('fit0_clear');
    const pmBeforeClear = loadPmCount();
    if(pmBeforeClear===PM_TOTAL) unlockAchievement('pm_full_clear');
    if(pmBeforeClear===1) unlockAchievement('pm_last_clear');
    resetPmCount(); // 新体制で再スタート(「生き返った」ではなく新しいチームへの再編成という体裁)
    result = { success:true, pmEvent:{ type:'clear', remaining: pmBeforeClear } };
  } else {
    updateStreakOnResult(false);
    const wrongMust = caseData.pool.filter(id=>session.trueCategory[id]==='Must' && session.guess[id]!=='Must');
    const wrongShould = caseData.pool.filter(id=>session.trueCategory[id]==='Should' && session.guess[id]!=='Should');
    const pmResult = decrementPm();
    const pmEvent = pmResult.remaining<=0
      ? { type:'bankrupt' }
      : { type:'departure', name: pmResult.name, remaining: pmResult.remaining };
    if(wrongMust.length>0){
      const causeId = wrongMust[Math.floor(Math.random()*wrongMust.length)];
      unlockDeath(session.caseId, causeId);
      result = { success:false, causeId, pmEvent };
    } else if(wrongShould.length>0){
      const causeId = wrongShould[Math.floor(Math.random()*wrongShould.length)];
      unlockDeath(session.caseId, causeId);
      result = { success:false, causeId, pmEvent };
    } else {
      result = { success:false, causeId:null, scopeMismatch:true, pmEvent };
    }
  }
  result.finalFitCount = finalFitCount;
  result.finalTotal = caseData.pool.length;

  goWithTransition('要件定義書を提出しました', '開発フェーズに移行しています', 1400, ()=>{
    state.result = result;
    state.screen = 'reveal';
  });
}

function renderRevealCount(){
  const r = state.result;
  app.innerHTML = `
    <div class="panel transition-screen">
      <div class="mascot-lg"><img src="${MASCOT_SRC}" alt="mascot"></div>
      <div class="transition-msg">最終照合中</div>
      <div class="reveal-count" id="revealCountValue">0 / ${r.finalTotal}</div>
      <div class="transition-sub">10項目のうち、いくつ合致しているか集計しています…</div>
    </div>
  `;
  const target = r.finalFitCount;
  const el = document.getElementById('revealCountValue');
  let current = 0;

  const finish = ()=>{
    setTimeout(()=>{ state.screen='result'; render(); }, 550);
  };

  if(target<=0){
    finish();
    return;
  }

  const stepTime = Math.max(70, Math.round(650/target));
  const timer = setInterval(()=>{
    current++;
    if(el) el.textContent = `${current} / ${r.finalTotal}`;
    if(current>=target){
      clearInterval(timer);
      finish();
    }
  }, stepTime);
}

function renderResult(){
  const caseData = CASES[state.caseId];
  const r = state.result;

  if(r.success){
    app.innerHTML = `
      <div class="panel result-screen">
        <div class="result-title success reveal-appear">✅ 案件クリア</div>
        <div class="result-sub">MoSCoW定義がすべて的中していました。</div>
        <div class="cause-card success-card stagger-in">
          <div class="cause-name">要件定義、完了。</div>
          <div class="cause-detail">${caseData.name}案件は、優先度づけが完璧に一致し、無事開発フェーズへ移行しました。</div>
        </div>
        <div class="pm-event-banner pm-event-clear">
          <div class="pm-clear-remaining">残存メンバー:${r.pmEvent.remaining}/${PM_TOTAL}</div>
          <div class="pm-clear-ellipsis">……</div>
          <div class="pm-clear-next">次のデスゲームへ</div>
        </div>
        <div class="action-row">
          <button class="btn primary" id="btnAgain">次の案件を受注する</button>
        </div>
      </div>
    `;
  } else {
    const death = r.scopeMismatch ? SCOPE_MISMATCH_DEATH : getDeathInfo(state.caseId, r.causeId);
    const req = r.causeId ? REQUIREMENTS[r.causeId] : null;
    const pmEvent = r.pmEvent;
    let pmBannerHTML = '';
    if(pmEvent && pmEvent.type==='bankrupt'){
      pmBannerHTML = `<div class="pm-event-banner pm-event-bankrupt">💥 PMチーム全滅 — 会社、倒産。<br><span style="font-size:11px; font-weight:400;">(新しいPMチーム${PM_TOTAL}名を再結成します)</span></div>`;
    } else if(pmEvent && pmEvent.type==='departure'){
      pmBannerHTML = `<div class="pm-event-banner pm-event-departure">PM${pmEvent.name}が離脱しました(${pmEvent.remaining}/${PM_TOTAL})</div>`;
    }
    app.innerHTML = `
      <div class="panel result-screen">
        <div class="skull">💀</div>
        <div class="result-title death reveal-appear">${death.name}</div>
        <div class="result-sub">プロジェクトは炎上しました</div>
        <div class="cause-card stagger-in">
          <div class="cause-name">原因</div>
          <div class="cause-detail">${death.detail}</div>
          ${req ? `<div class="cause-hint">正しい優先度:<b>「${req.name}」は${state.session.trueCategory[r.causeId]}</b></div>` : `<div class="cause-hint">優先度の低い要件の扱いを間違えたのが原因でした。</div>`}
        </div>
        ${pmBannerHTML}
        <div class="action-row">
          <button class="btn primary" id="btnAgain">次の案件を受注する</button>
        </div>
      </div>
    `;
  }
  document.getElementById('btnAgain').addEventListener('click', ()=>{ state.screen='select'; render(); });
}

/* ===== 死因コレクション/トロフィー画面 ===== */
function renderCollectionScreen(){
  const tab = state.collectionTab || 'trophy';
  const page = state.collectionPage || 0;

  const tabsHTML = `
    <div class="tab-row">
      <button class="tab-btn ${tab==='trophy'?'active':''}" data-tab="trophy">トロフィー</button>
      <button class="tab-btn ${tab==='death'?'active':''}" data-tab="death">死因コレクション(おまけ)</button>
    </div>
  `;

  let bodyHTML = '';
  let totalPages = 1;

  if(tab==='death'){
    const col = loadCollection();
    const entries = getAllCollectibleEntries();
    totalPages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
    const pageEntries = entries.slice(page*PAGE_SIZE, page*PAGE_SIZE + PAGE_SIZE);
    bodyHTML = `
      <div class="collection-grid">
        ${pageEntries.map((e,i)=>{
          const no = page*PAGE_SIZE + i + 1;
          const key = collectionKey(e.caseId, e.reqId);
          const unlocked = !!col[key];
          return `<div class="collection-item ${unlocked?'unlocked':''}">
            <span class="item-no">No.${String(no).padStart(3,'0')}</span>
            <span class="mark">${unlocked?'💀':'？'}</span>
            ${unlocked ? e.death.name : '未確認の死因'}
          </div>`;
        }).join('')}
      </div>
      <div class="collection-note">${Object.keys(col).length} / ${entries.length} 件の死因を収集済み</div>
    `;
  } else {
    const allEntries = getAllTrophyEntries();
    totalPages = Math.max(1, Math.ceil(allEntries.length / PAGE_SIZE));
    const pageEntries = allEntries.slice(page*PAGE_SIZE, page*PAGE_SIZE + PAGE_SIZE);
    bodyHTML = `
      <div class="collection-grid">
        ${pageEntries.map((t,i)=>{
          const no = page*PAGE_SIZE + i + 1;
          if(t.kind==='count'){
            return `<div class="collection-item ${t.unlocked?'unlocked':''}">
              <span class="item-no">No.${String(no).padStart(3,'0')}</span>
              <span class="mark">${t.unlocked?'🏆':'🔒'}</span>
              ${t.label}<br>${Math.min(t.current,t.threshold)} / ${t.threshold}
            </div>`;
          } else {
            return `<div class="collection-item ${t.unlocked?'unlocked':''}">
              <span class="item-no">No.${String(no).padStart(3,'0')}</span>
              <span class="mark">${t.unlocked?'🏆':'🔒'}</span>
              ${t.label}<br><span style="font-size:9.5px;">${t.unlocked ? '達成済み' : t.desc}</span>
            </div>`;
          }
        }).join('')}
      </div>
    `;
  }

  const pagerHTML = `
    <div class="pager-row">
      <button class="btn ghost" id="btnPagePrev" ${page<=0?'disabled':''}>&lt; 前へ</button>
      <span class="pager-label">${page+1} / ${totalPages}</span>
      <button class="btn ghost" id="btnPageNext" ${page>=totalPages-1?'disabled':''}>次へ &gt;</button>
    </div>
  `;

  app.innerHTML = `
    <div class="panel">
      ${tabsHTML}
      ${bodyHTML}
      ${pagerHTML}
      <div class="action-row">
        <button class="btn ghost" id="btnBackToSelect">案件選択に戻る</button>
      </div>
    </div>
  `;

  app.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.collectionTab = btn.dataset.tab;
      state.collectionPage = 0;
      render();
    });
  });
  const prevBtn = document.getElementById('btnPagePrev');
  const nextBtn = document.getElementById('btnPageNext');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ state.collectionPage = Math.max(0, page-1); render(); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ state.collectionPage = Math.min(totalPages-1, page+1); render(); });
  document.getElementById('btnBackToSelect').addEventListener('click', ()=>{ state.screen = 'select'; render(); });
}

document.getElementById('headerMascot').innerHTML = `<img src="${MASCOT_SRC}" alt="mascot">`;
render();


</script>
